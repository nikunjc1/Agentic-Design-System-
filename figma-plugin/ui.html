.row.is-idle #spinner,.row.is-done #spinner,.row.is-error #spinner{display:none}

button{padding:8px 12px}

<h2>Agentic Contract Bridge</h2>
<p id="build">Starting plugin…</p>
<div class="row is-idle" id="statusRow"><span id="spinner" aria-hidden="true"></span><p id="status" role="status" aria-live="polite">Connecting…</p></div>
<button type="button" id="connect">Connect / Retry</button>
<script>
const row=document.getElementById('statusRow');
// `status` keeps setting plain textContent on #status, unchanged from
// before - only the surrounding row's state (idle/processing/done/error)
// is new, so this stays a live, visible account of what's happening
// ("Creating "Button": Rendering 96 / 384") instead of a static panel that
// looks the same whether the plugin is mid-job or sitting idle.
function status(message,state){document.getElementById('status').textContent=message;row.className='row'+(state?' is-'+state:'');}
let ready=false;
window.onmessage=event=>{
 const message=event.data?.pluginMessage;if(!message)return;
 if(message.type==='ready'){ready=true;document.getElementById('build').textContent=message.build+' · '+message.transport;}
 if(message.type==='connection')status(message.message,message.connected?'idle':'processing');
 if(message.type==='error')status(message.message,'error');
 if(message.type==='warning')status(message.message,'processing');
 if(message.type==='progress')status(message.phase,'processing');
 if(message.type==='complete'){
  const result=message.result||{};
  status(result.variantCount?'Created '+result.variantCount+' variants. '+(result.warnings||[]).join(' '):'Completed. Ready for the next request.',(result.warnings||[]).length?'error':'done');
 }
};
document.getElementById('connect').onclick=()=>parent.postMessage({pluginMessage:{type:'connect'}},'*');
function hello(){if(ready)return;parent.postMessage({pluginMessage:{type:'hello'}},'*');setTimeout(hello,1000);}
hello();
</script></body></html>
